spring.application.name=comic-sticks
server.port=8080

# Uploads. Must stay in step with MAX_FILE_BYTES in the frontend's comic-api.service.ts.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- LLM: any OpenAI-compatible chat-completions endpoint ---------------------
# Defaults to the local Ollama server. Ollama ignores the key, but it must not be blank.
# Environment variables override these, and a hosted provider's key never reaches the browser.
#
# OpenAI:
#   LLM_BASE_URL=https://api.openai.com/v1
#   LLM_MODEL=<an OpenAI model id>
#   LLM_API_KEY=sk-...
# Gemini:
#   LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
#   LLM_MODEL=<a Gemini model id>
#   LLM_API_KEY=<Gemini key>
comic.llm.base-url=${LLM_BASE_URL:http://192.168.1.239:11434/v1}
comic.llm.api-key=${LLM_API_KEY:ollama}
comic.llm.model=${LLM_MODEL:qwen2.5-coder:7b}
# Generous because local models can take minutes, especially when loading into memory.
comic.llm.timeout=300s
# Upper bound on the reply, including any reasoning tokens. A truncated reply is reported as an error.
comic.llm.max-output-tokens=16000
# Run time estimate shown before generating: parts x (seconds-per-part + seconds-per-notes-call)
# + panels x seconds-per-panel. Retries of a part with invalid dialogue are not counted.
# Measured with qwen2.5-coder:7b. The "Part n of m" log lines give the timings for other models.
comic.llm.seconds-per-part=3
comic.llm.seconds-per-panel=4
# Each part also makes a small "what it means" notes call when notes are on.
comic.llm.seconds-per-notes-call=2
# The character pass reads the story in chunks before drawing, one call per chunk.
comic.llm.seconds-per-character-chunk=6

# --- Story limits -------------------------------------------------------------
# One comic is one chapter, or one pasted piece. Text that needs more panels than max-panels is
# refused with a message asking for chapters or a shorter piece; it is never squeezed to fit.
comic.story.max-input-chars=30000
comic.story.max-panels=200
# Most text sent to the LLM in one call. A larger group or scene is split at paragraphs or sentences.
comic.story.max-part-chars=4000
# Support levels: each part becomes one panel (the final part gets two when it can).
# Level 1: one panel per paragraph. Longer paragraphs are cut at sentences, about 2 to 3 lines each.
comic.story.level1-max-part-chars=300
# Level 1: only lines shorter than this join a neighbour (a heading, or a short line of dialogue
# and its reply).
comic.story.short-line-chars=60
# Level 2: paragraphs per panel. A single leftover paragraph joins the group before it.
comic.story.level2-paragraphs-per-panel=3
# Level 3: one panel per scene, split at ***, * * *, extra blank lines and chapter headings. With no
# markers, paragraphs are grouped between these bounds. Longer scenes are split.
comic.story.level3-min-paragraphs=6
comic.story.level3-max-paragraphs=10

# --- Character sheet ------------------------------------------------------------
# Before drawing, the story is read in chunks of about this size to find its main characters and
# places, each given a fixed design. The user reviews the sheet, and every panel draws from it.
comic.characters.chunk-chars=4000
comic.characters.max-characters=12
comic.characters.max-places=8
