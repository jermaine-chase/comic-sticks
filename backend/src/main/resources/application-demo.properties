# Offline mode: stories are split into panels by DemoComicGenerator, with no LLM call
# and no API key. Enable with: mvn spring-boot:run -Dspring-boot.run.profiles=demo

# Saved comics go to an in-memory H2 database, so the demo needs no PostgreSQL. They are lost when
# the server stops. Set DEMO_DB_URL (for example jdbc:h2:file:./data/demo) to keep them.
spring.datasource.url=${DEMO_DB_URL:jdbc:h2:mem:comic-sticks;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
